<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraftaffix | Links</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(100, 200, 255, 0.1) 0%, transparent 70%);
            animation: bgMove 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 95%;
            max-width: 800px;
            height: 95vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Profile Header */
        .profile-header {
            text-align: center;
            margin-bottom: 24px;
            flex-shrink: 0;
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            border-radius: 50%;
            z-index: -1;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .status-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            background: #10b981;
            border-radius: 50%;
            border: 3px solid #0a0a0a;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }

        .profile-header h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .profile-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 400;
        }

        /* 2 Column Links Grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
            overflow: visible;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .link-card:hover::before {
            transform: translateX(100%);
        }

        .link-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .link-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: transform 0.3s;
            flex-shrink: 0;
        }

        .link-card:hover .link-icon {
            transform: scale(1.1);
        }

        /* Platform Colors */
        .youtube { background: rgba(255, 0, 0, 0.15); color: #ff4444; }
        .twitch { background: rgba(145, 70, 255, 0.15); color: #9146ff; }
        .twitter { background: rgba(29, 161, 242, 0.15); color: #1da1f2; }
        .github { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .link-content {
            flex: 1;
            min-width: 0;
        }

        .link-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .link-handle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-arrow {
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .link-card:hover .link-arrow {
            color: rgba(255, 255, 255, 0.8);
            transform: translateX(4px);
        }

        /* Donate Section - Special Styling */
        .donate-section {
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .donate-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            background: linear-gradient(135deg, rgba(255, 100, 100, 0.15) 0%, rgba(255, 150, 100, 0.15) 100%);
            border: 2px solid rgba(255, 100, 100, 0.3);
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(255, 100, 100, 0.2);
        }

        .donate-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 200, 200, 0.2), transparent);
            transition: left 0.6s;
        }

        .donate-card:hover::before {
            left: 100%;
        }

        .donate-card:hover {
            transform: translateY(-3px) scale(1.02);
            background: linear-gradient(135deg, rgba(255, 100, 100, 0.25) 0%, rgba(255, 150, 100, 0.25) 100%);
            border-color: rgba(255, 100, 100, 0.5);
            box-shadow: 0 12px 40px rgba(255, 100, 100, 0.3);
        }

        .donate-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .donate-content {
            text-align: center;
        }

        .donate-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .donate-url {
            font-size: 13px;
            color: rgba(255, 200, 200, 0.8);
        }

        .donate-arrow {
            color: rgba(255, 200, 200, 0.6);
            font-size: 18px;
            transition: all 0.3s;
        }

        .donate-card:hover .donate-arrow {
            color: rgba(255, 255, 255, 0.9);
            transform: translateX(6px);
        }

        /* Footer */
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            flex-shrink: 0;
        }

        .footer-heart {
            color: #e25555;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon {
            color: #10b981;
        }

        /* Mobile Responsive */
        @media (max-width: 640px) {
            .links-grid {
                gap: 10px;
            }

            .link-card {
                padding: 14px 16px;
            }

            .link-icon {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .link-title {
                font-size: 14px;
            }

            .link-handle {
                font-size: 11px;
            }

            .avatar {
                width: 70px;
                height: 70px;
                font-size: 28px;
            }

            .profile-header h1 {
                font-size: 24px;
            }

            .donate-card {
                padding: 16px 20px;
            }

            .donate-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .donate-title {
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .links-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grid-overlay"></div>

    <div class="container">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="avatar-container">
                <div class="avatar">
                    <img src="https://github.com/KraftAffix/assets/blob/main/ArdeliaPFP.png?raw=true" alt="Kraftaffix" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-user\'></i>';">
                </div>
                <div class="status-badge"></div>
            </div>
            <h1>Kraftaffix</h1>
            <p>Creator • Developer • Streamer</p>
        </div>

        <!-- 2 Column Links Grid -->
        <div class="links-grid">
            <a href="https://www.youtube.com/@kraftaffix" target="_blank" class="link-card" data-platform="YouTube">
                <div class="link-icon youtube">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="link-content">
                    <div class="link-title">YouTube</div>
                    <div class="link-handle">@kraftaffix</div>
                </div>
                <i class="fas fa-arrow-right link-arrow"></i>
            </a>

            <a href="https://www.twitch.tv/kraftaffix" target="_blank" class="link-card" data-platform="Twitch">
                <div class="link-icon twitch">
                    <i class="fab fa-twitch"></i>
                </div>
                <div class="link-content">
                    <div class="link-title">Twitch</div>
                    <div class="link-handle">twitch.tv/kraftaffix</div>
                </div>
                <i class="fas fa-arrow-right link-arrow"></i>
            </a>

            <a href="https://twitter.com/kraftaffix" target="_blank" class="link-card" data-platform="Twitter">
                <div class="link-icon twitter">
                    <i class="fab fa-twitter"></i>
                </div>
                <div class="link-content">
                    <div class="link-title">Twitter</div>
                    <div class="link-handle">@kraftaffix</div>
                </div>
                <i class="fas fa-arrow-right link-arrow"></i>
            </a>

            <a href="https://github.com/kraftaffix" target="_blank" class="link-card" data-platform="GitHub">
                <div class="link-icon github">
                    <i class="fab fa-github"></i>
                </div>
                <div class="link-content">
                    <div class="link-title">GitHub</div>
                    <div class="link-handle">github.com/kraftaffix</div>
                </div>
                <i class="fas fa-arrow-right link-arrow"></i>
            </a>
        </div>

        <!-- Donate Section - Special Full Width -->
        <div class="donate-section">
            <a href="https://ko-fi.com/kraftaffix" target="_blank" class="donate-card" data-platform="Ko-fi">
                <div class="donate-icon">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="donate-content">
                    <div class="donate-title">
                        Donate Here
                        <i class="fas fa-external-link-alt" style="font-size: 12px; opacity: 0.7;"></i>
                    </div>
                    <div class="donate-url">ko-fi.com/kraftaffix</div>
                </div>
                <i class="fas fa-arrow-right donate-arrow"></i>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            Made with <span class="footer-heart">❤</span> by Kraftaffix
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle toast-icon"></i>
        <span id="toast-message">Opening...</span>
    </div>

    <script>
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        document.querySelectorAll('.link-card, .donate-card').forEach(card => {
            card.addEventListener('click', (e) => {
                const platform = card.getAttribute('data-platform');
                showToast(`Opening ${platform}...`);

                // Ripple effect
                const ripple = document.createElement('div');
                ripple.style.cssText = `
                    position: absolute;
                    border-radius: 50%;
                    background: rgba(255, 255, 255, 0.3);
                    transform: scale(0);
                    animation: ripple 0.6s linear;
                    pointer-events: none;
                `;

                const rect = card.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size/2) + 'px';

                card.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });

            card.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const url = card.getAttribute('href');
                navigator.clipboard.writeText(url).then(() => {
                    showToast('Link copied!');
                });
            });
        });

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to { transform: scale(4); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Staggered entrance
        document.querySelectorAll('.link-card').forEach((card, index) => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(10px)';
            setTimeout(() => {
                card.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, index * 60);
        });

        // Donate card entrance
        const donateCard = document.querySelector('.donate-card');
        donateCard.style.opacity = '0';
        donateCard.style.transform = 'translateY(10px)';
        setTimeout(() => {
            donateCard.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            donateCard.style.opacity = '1';
            donateCard.style.transform = 'translateY(0)';
        }, 300);
    </script>
</body>
</html>
